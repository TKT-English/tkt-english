<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Экзамен - Модуль {{ module_id }}</title>
    <style>
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 20px;
        }

        .watermark {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.12;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            transform: rotate(-25deg);
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            position: relative;
            z-index: 1;
        }

        .q-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; line-height: 1.5; color: #1e293b; }
        
        .option-btn {
            display: block; width: 100%; text-align: left; padding: 12px 16px;
            margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px;
            background: white; cursor: pointer; font-size: 15px; box-sizing: border-box;
        }
        .option-btn:hover { background: #f1f5f9; border-color: #3b82f6; }
        .option-btn.selected { background: #eff6ff; border-color: #3b82f6; font-weight: bold; color: #1d4ed8; }

        .matching-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        .matching-label { font-weight: bold; width: 45%; color: #334155; }
        .matching-select { width: 50%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; }

        .btn-next, .btn-home {
            display: block; width: 100%; padding: 14px; background: #22c55e;
            color: white; border: none; border-radius: 8px; font-size: 16px;
            font-weight: bold; cursor: pointer; margin-top: 20px; text-align: center; text-decoration: none; box-sizing: border-box;
        }
        .btn-next:hover, .btn-home:hover { background: #16a34a; }
        .btn-home { background: #007bff; margin-top: 25px; }

        /* Стиль для разбора результатов */
        .result-summary { text-align: center; margin-bottom: 30px; }
        .result-score { font-size: 24px; font-weight: bold; color: #1e293b; }
        
        .result-item {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #fafafa;
        }
        .result-item.correct-item { border-left: 6px solid #22c55e; }
        .result-item.incorrect-item { border-left: 6px solid #ef4444; }

        .q-status { font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        .status-pass { color: #16a34a; }
        .status-fail { color: #dc2626; }

        .user-ans { margin: 5px 0; font-size: 14px; color: #dc2626; }
        .correct-ans { margin: 5px 0; font-size: 14px; color: #16a34a; font-weight: bold; }
        .pair-list { padding-left: 20px; margin: 5px 0; font-size: 14px; }
    </style>
</head>
<body oncontextmenu="return false;" oncopy="return false;" oncut="return false;">

    <div class="watermark" id="wm-container"></div>

    <!-- ОКНО ТЕСТИРОВАНИЯ -->
    <div class="container" id="quiz-box">
        <h3 id="q-number" style="color: #64748b;">Вопрос 1 из {{ questions|length }}</h3>
        <div class="q-title" id="q-text">Загрузка...</div>
        <div id="options-container"></div>
        <button class="btn-next" onclick="nextQuestion()">Следующий вопрос ➔</button>
    </div>

    <!-- ОКНО РЕЗУЛЬТАТОВ -->
    <div class="container" id="results-box" style="display: none;">
        <div class="result-summary">
            <h2>Результаты экзамена</h2>
            <div class="result-score" id="score-display">0 из 0</div>
        </div>

        <div id="results-details"></div>

        <a href="/" class="btn-home">Вернуться в главное меню</a>
    </div>

    <script>
        const questions = {{ questions|tojson }};
        const studentUser = "{{ user }}";
        let currentIdx = 0;
        let score = 0;
        let selectedAnswer = null;

        // Хранение ответов пользователя
        const userResults = [];

        // Водяной знак
        const wmContainer = document.getElementById('wm-container');
        const wmText = `${studentUser} • CompTIA Exam • ${new Date().toLocaleDateString()}`;
        for(let i = 0; i < 12; i++) {
            const span = document.createElement('div');
            span.innerText = wmText;
            wmContainer.appendChild(span);
        }

        // Блокировка хоткеев
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || 
               (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's')) ||
               (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J'))) {
                e.preventDefault();
                alert('Копирование запрещено!');
            }
        });

        function loadQuestion() {
            if (questions.length === 0) {
                document.getElementById('q-text').innerText = "В данном модуле нет вопросов.";
                return;
            }
            selectedAnswer = null;
            const q = questions[currentIdx];
            document.getElementById('q-number').innerText = `Вопрос ${currentIdx + 1} из ${questions.length}`;
            document.getElementById('q-text').innerText = q.question;

            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';

            if (q.type === 'choice') {
                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    btn.onclick = () => {
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedAnswer = opt;
                    };
                    optContainer.appendChild(btn);
                });
            } else if (q.type === 'matching') {
                const pairs = q.pairs || q.pairs_data || [];
                let rightOptions = pairs.map(p => p.right || p[1]).sort(() => Math.random() - 0.5);

                pairs.forEach((p) => {
                    const leftText = p.left || p[0];
                    const row = document.createElement('div');
                    row.className = 'matching-row';
                    
                    let selectOptions = '<option value="">-- Выберите совпадение --</option>';
                    rightOptions.forEach(r => {
                        selectOptions += `<option value="${r}">${r}</option>`;
                    });

                    row.innerHTML = `
                        <div class="matching-label">${leftText}</div>
                        <select class="matching-select" data-left="${leftText}">${selectOptions}</select>
                    `;
                    optContainer.appendChild(row);
                });
            }
        }

        function nextQuestion() {
            const q = questions[currentIdx];

            if (q.type === 'choice') {
                const isCorrect = (selectedAnswer === q.correct);
                if (isCorrect) score++;

                userResults.push({
                    question: q.question,
                    type: 'choice',
                    isCorrect: isCorrect,
                    userAns: selectedAnswer || "Ответ не выбран",
                    correctAns: q.correct
                });
            } else if (q.type === 'matching') {
                const pairs = q.pairs || q.pairs_data || [];
                const selects = document.querySelectorAll('.matching-select');
                let allCorrect = true;
                let userPairs = [];
                let correctPairs = [];

                selects.forEach(sel => {
                    const leftVal = sel.getAttribute('data-left');
                    const userRightVal = sel.value;
                    const pair = pairs.find(p => (p.left || p[0]) === leftVal);
                    const correctRightVal = pair ? (pair.right || pair[1]) : null;

                    userPairs.push({ left: leftVal, right: userRightVal || "Не выбрано" });
                    correctPairs.push({ left: leftVal, right: correctRightVal });

                    if (userRightVal !== correctRightVal) {
                        allCorrect = false;
                    }
                });

                if (allCorrect && selects.length > 0) score++;

                userResults.push({
                    question: q.question,
                    type: 'matching',
                    isCorrect: allCorrect,
                    userPairs: userPairs,
                    correctPairs: correctPairs
                });
            }

            currentIdx++;
            if (currentIdx < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-box').style.display = 'none';
            document.getElementById('results-box').style.display = 'block';

            document.getElementById('score-display').innerText = `${score} из ${questions.length} (${Math.round((score / questions.length) * 100)}%)`;

            const detailsContainer = document.getElementById('results-details');
            detailsContainer.innerHTML = '';

            userResults.forEach((res, index) => {
                const item = document.createElement('div');
                item.className = `result-item ${res.isCorrect ? 'correct-item' : 'incorrect-item'}`;

                let statusText = res.isCorrect 
                    ? '<span class="q-status status-pass">✔ Правильно</span>' 
                    : '<span class="q-status status-fail">✖ Ошибка</span>';

                let bodyHtml = '';

                if (res.type === 'choice') {
                    bodyHtml = `
                        ${!res.isCorrect ? `<div class="user-ans">Ваш ответ: <b>${res.userAns}</b></div>` : ''}
                        <div class="correct-ans">Правильный ответ: <b>${res.correctAns}</b></div>
                    `;
                } else if (res.type === 'matching') {
                    if (res.isCorrect) {
                        bodyHtml = '<div class="correct-ans">Все пары сопоставлены верно!</div>';
                    } else {
                        bodyHtml += '<div class="user-ans"><b>Ваши ответы:</b><ul class="pair-list">';
                        res.userPairs.forEach(p => {
                            bodyHtml += `<li><b>${p.left}</b> ➔ ${p.right}</li>`;
                        });
                        bodyHtml += '</ul></div>';

                        bodyHtml += '<div class="correct-ans"><b>Правильные совпадения:</b><ul class="pair-list">';
                        res.correctPairs.forEach(p => {
                            bodyHtml += `<li><b>${p.left}</b> ➔ ${p.right}</li>`;
                        });
                        bodyHtml += '</ul></div>';
                    }
                }

                item.innerHTML = `
                    <div><strong>${index + 1}. ${res.question}</strong></div>
                    <div style="margin-top: 5px;">${statusText}</div>
                    <div style="margin-top: 8px;">${bodyHtml}</div>
                `;

                detailsContainer.appendChild(item);
            });
        }

        loadQuestion();
    </script>
</body>
</html>
