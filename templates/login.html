<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemə daxil ol | Məktəb Portalı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            background: #ffffff;
            overflow: hidden;
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            background: #0d6efd;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .login-body {
            padding: 30px 25px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <i class="bi bi-mortarboard-fill display-4 mb-2"></i>
        <h4 class="fw-bold mb-0">Məktəb Portalı</h4>
        <p class="small text-white-50 mb-0">Şəxsi kabinetə daxil olmaq üçün məlumatlarınızı daxil edin</p>
    </div>
    
    <div class="login-body">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show text-center py-2 mb-3" role="alert" style="font-size: 0.875rem;">
                {{ message }}
                <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="/">
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">
                    <i class="bi bi-person me-1"></i> İstifadəçi adı
                </label>
                <input type="text" name="username" class="form-control form-control-lg fs-6" placeholder="İstifadəçi adınızı daxil edin" required autofocus>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary">
                    <i class="bi bi-lock me-1"></i> Şifrə
                </label>
                <input type="password" name="password" class="form-control form-control-lg fs-6" placeholder="Şifrənizi daxil edin" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold fs-6 shadow-sm">
                <i class="bi bi-box-arrow-in-right me-2"></i> Daxil ol
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
